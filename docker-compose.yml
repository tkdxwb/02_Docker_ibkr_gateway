name: algo-trader

# =============================================================================
# 三个 LIVE 账户，各自独立容器 / 独立主机端口 / 独立 VNC。
# 凭证与端口在 .env 中配置 —— 先 `cp .env.example .env` 再填写。
#
# 端口映射（主机 -> 容器）:
#   ib-gateway-1  API 4001 -> 4003(socat) -> 4001(gw)   VNC 5900 -> 5900
#   ib-gateway-2  API 4011 -> 4003(socat) -> 4001(gw)   VNC 5901 -> 5900
#   ib-gateway-3  API 4021 -> 4003(socat) -> 4001(gw)   VNC 5902 -> 5900
#
# 注意: 本方案假设三个账户是【三套独立的 IBKR 登录用户名】。
#       若它们是同一登录下的关联/子账户, 只需一个 Gateway, 通过 API 的
#       account 字段区分即可, 不要起三个容器。
# =============================================================================

x-ib-gateway: &ib-gateway
  image: ghcr.io/gnzsnz/ib-gateway:latest
  restart: always

# 三个容器共用的非凭证环境变量
x-common-env: &common-env
  TRADING_MODE: ${TRADING_MODE:-live}
  # 把 TWS 设置存到独立目录, 不与镜像内 gateway 安装目录重叠,
  # 这样将来升级镜像版本不会被旧设置目录遮蔽。
  # 该目录通过 bind mount 持久化到宿主 ./tws_settings/ (见下方各服务 volumes)。
  TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
  VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
  TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-manual}
  TWS_MASTER_CLIENT_ID: ${TWS_MASTER_CLIENT_ID:-}
  READ_ONLY_API: ${READ_ONLY_API:-}
  TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
  BYPASS_WARNING: ${BYPASS_WARNING:-}
  AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
  AUTO_LOGOFF_TIME: ${AUTO_LOGOFF_TIME:-}
  TWS_COLD_RESTART: ${TWS_COLD_RESTART:-}
  SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-}
  RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
  TWOFA_EXIT_INTERVAL: ${TWOFA_EXIT_INTERVAL:-60}
  TWOFA_DEVICE: ${TWOFA_DEVICE:-}
  EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
  ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
  TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
  TZ: ${TIME_ZONE:-Etc/UTC}
  CUSTOM_CONFIG: ${CUSTOM_CONFIG:-NO}
  JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-}
  SSH_TUNNEL: ${SSH_TUNNEL:-}
  SSH_OPTIONS: ${SSH_OPTIONS:-}
  SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
  SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
  SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
  SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
  SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
  SSH_RESTART: ${SSH_RESTART:-}
  SSH_VNC_PORT: ${SSH_VNC_PORT:-}
  START_SCRIPTS: ${START_SCRIPTS:-}
  X_SCRIPTS: ${X_SCRIPTS:-}
  IBC_SCRIPTS: ${IBC_SCRIPTS:-}

services:
  ib-gateway-1:
    <<: *ib-gateway
    container_name: ib-gateway-1
    # 仅此服务带 build, 三个服务共用同一镜像 tag
    build:
      context: ./latest
      tags:
        - "ghcr.io/gnzsnz/ib-gateway:latest"
    environment:
      <<: *common-env
      TWS_USERID: ${ACCT1_USERID}
      TWS_PASSWORD: ${ACCT1_PASSWORD}
    ports:
      - "127.0.0.1:${ACCT1_API_PORT:-4001}:4003"
      - "127.0.0.1:${ACCT1_VNC_PORT:-5900}:5900"
    volumes:
      # bind mount: 宿主 uid 必须与容器内 ibgateway(默认 1000) 一致, 否则无写权限
      - ./tws_settings/ib-gateway-1:/home/ibgateway/tws_settings

  ib-gateway-2:
    <<: *ib-gateway
    container_name: ib-gateway-2
    environment:
      <<: *common-env
      TWS_USERID: ${ACCT2_USERID}
      TWS_PASSWORD: ${ACCT2_PASSWORD}
    ports:
      - "127.0.0.1:${ACCT2_API_PORT:-4011}:4003"
      - "127.0.0.1:${ACCT2_VNC_PORT:-5901}:5900"
    volumes:
      - ./tws_settings/ib-gateway-2:/home/ibgateway/tws_settings

  ib-gateway-3:
    <<: *ib-gateway
    container_name: ib-gateway-3
    environment:
      <<: *common-env
      TWS_USERID: ${ACCT3_USERID}
      TWS_PASSWORD: ${ACCT3_PASSWORD}
    ports:
      - "127.0.0.1:${ACCT3_API_PORT:-4021}:4003"
      - "127.0.0.1:${ACCT3_VNC_PORT:-5902}:5900"
    volumes:
      - ./tws_settings/ib-gateway-3:/home/ibgateway/tws_settings
